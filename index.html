<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>裏まとめ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 28px;
      font-weight: bold;
    }

    p {
      margin-top: 10px;
      font-size: 16px;
    }

    .button-bar {
      margin: 30px auto;
      width: 90%;
      max-width: 500px;
      background: linear-gradient(to right, #222, #444);
      color: white;
      padding: 15px;
      border-radius: 30px;
      font-size: 18px;
    }

    .video-box {
      width: 90%;
      max-width: 500px;
      height: 300px;
      background: black;
      margin: 20px auto 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      cursor: pointer;
    }

    .play-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-icon:after {
      content: "";
      border-left: 25px solid white;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      margin-left: 5px;
    }
  </style>
</head>

<body>

  <h1>裏まとめ</h1>
  <p>新たに見つけ次第動画追加します</p>

  <div class="button-bar">
    フル動画はこちら　14分46秒
  </div>

  <div class="video-box" onclick="goToLink()">
    <div class="play-icon"></div>
  </div>

  <script>
    function goToLink() {
      window.location.href = "https://onelink.shein.com/29/5gditkuzqd55";
    }
  </script>

</body>
</html>
